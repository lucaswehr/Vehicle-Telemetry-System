; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter =
  +<*>
  -<sd_test.cpp>
  -<elm_test.cpp>
  -<display_test.cpp>
  -<dash_demo.cpp>
  -<elm327.cpp>
  -<display_ui.cpp>
  -<main_full.cpp>

; Bench testing at a desk: starts logging immediately instead of waiting for the car to move.
[env:bench]
extends = env:esp32dev
build_flags = -DLOG_WITHOUT_MOVEMENT

[env:sd_test]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter =
  -<*>
  +<sd_test.cpp>

; ELM327 bring-up test, run in the car: connects to the Bluetooth adapter and prints what the car says.
; Bluetooth Classic makes the program big, so it needs the larger app partition.
[env:elm_test]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_src_filter =
  -<*>
  +<elm_test.cpp>

; Display bring-up: colors, orientation and touch, to check the wiring before any real screen code.
; Display on its own SPI bus (HSPI) so SD writes never stall it. Pins: see the table in README.
[env:display_test]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = bodmer/TFT_eSPI@^2.5.43
build_src_filter =
  -<*>
  +<display_test.cpp>
build_flags =
  -DUSER_SETUP_LOADED=1
  -DST7796_DRIVER=1
  -DTFT_WIDTH=320
  -DTFT_HEIGHT=480
  -DUSE_HSPI_PORT=1
  -DTFT_MISO=-1
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=27
  -DTFT_RST=26
  -DTFT_BL=25
  -DTFT_BACKLIGHT_ON=HIGH
  -DSPI_FREQUENCY=40000000
  -DTFT_INVERSION_ON=1
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DLOAD_FONT6=1
  -DLOAD_FONT7=1
  -DLOAD_FONT8=1

; Dashboard demo: the three real pages in portrait with fake data (same display wiring and flags as display_test).
[env:dash_demo]
extends = env:display_test
build_src_filter =
  -<*>
  +<dash_demo.cpp>

; The car firmware: GPS + SD logging + OBD-II over Bluetooth + the screen, all in one. Built from main_full.cpp;
; the logger-only baseline stays in the esp32dev environment. Bluetooth Classic needs the larger app partition.
[env:car]
extends = env:display_test
board_build.partitions = huge_app.csv
build_src_filter =
  +<*>
  -<sd_test.cpp>
  -<elm_test.cpp>
  -<display_test.cpp>
  -<dash_demo.cpp>
  -<main.cpp>

[env:native]
platform = native
